<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="attitude-toward-periodontal-health-title attitude-toward-periodontal-health-subtitle">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f1a24" flood-opacity="0.08" />
    </filter>
    
  </defs>
  <style>
  .title { font: 700 30px "Avenir Next", "Segoe UI", sans-serif; fill: #12202c; }
  .subtitle { font: 500 15px "Avenir Next", "Segoe UI", sans-serif; fill: #5f6c77; }
  .axis { font: 500 13px "Avenir Next", "Segoe UI", sans-serif; fill: #5f6c77; }
  .label { font: 600 15px "Avenir Next", "Segoe UI", sans-serif; fill: #12202c; }
  .labelMuted { font: 500 13px "Avenir Next", "Segoe UI", sans-serif; fill: #5f6c77; }
  .value { font: 700 14px "Avenir Next", "Segoe UI", sans-serif; fill: #12202c; }
  .small { font: 500 12px "Avenir Next", "Segoe UI", sans-serif; fill: #5f6c77; }
  .grid { stroke: #d7ddd7; stroke-width: 1; stroke-dasharray: 2 6; }
  .axisLine { stroke: #5f6c77; stroke-width: 1.25; }
</style>
  <rect x="0" y="0" width="1280" height="840" rx="30" fill="#fcfaf5" />
  <rect x="16" y="16" width="1248" height="808" rx="26" fill="#f7f3ea" stroke="#d7ddd7" />
  <text id="attitude-toward-periodontal-health-title" class="title" x="52" y="68"><tspan x="52" dy="0">Attitude toward periodontal health</tspan></text>
  <text id="attitude-toward-periodontal-health-subtitle" class="subtitle" x="52" y="96"><tspan x="52" dy="0">Agreement sits on the right; disagreement sits on the left.</tspan></text>
  <line class="grid" x1="490" x2="490" y1="144" y2="798" /><text class="axis" text-anchor="middle" x="490" y="820">100%</text><line class="grid" x1="665" x2="665" y1="144" y2="798" /><text class="axis" text-anchor="middle" x="665" y="820">50%</text><line class="grid" x1="840" x2="840" y1="144" y2="798" /><text class="axis" text-anchor="middle" x="840" y="820">0%</text><line class="grid" x1="1015" x2="1015" y1="144" y2="798" /><text class="axis" text-anchor="middle" x="1015" y="820">50%</text><line class="grid" x1="1190" x2="1190" y1="144" y2="798" /><text class="axis" text-anchor="middle" x="1190" y="820">100%</text><line class="axisLine" x1="840" x2="840" y1="144" y2="798" />
        <circle cx="520" cy="126" r="7" fill="#d8654d" />
        <text class="labelMuted" x="534" y="131">Strongly Disagree</text>
      
        <circle cx="690" cy="126" r="7" fill="#e7bf75" />
        <text class="labelMuted" x="704" y="131">Disagree</text>
      
        <circle cx="860" cy="126" r="7" fill="#3b9c94" />
        <text class="labelMuted" x="874" y="131">Agree</text>
      
        <circle cx="1030" cy="126" r="7" fill="#234d70" />
        <text class="labelMuted" x="1044" y="131">Strongly Agree</text>
      <text class="label" text-anchor="start" x="44" y="188"><tspan x="44" dy="0">Visiting a dentist is necessary</tspan><tspan x="44" dy="18">only when I have pain or</tspan><tspan x="44" dy="18">discomfort.</tspan></text><rect x="604.45" y="192" width="184.1" height="24" rx="10" fill="#e7bf75" /><rect x="788.5500000000001" y="192" width="51.449999999999996" height="24" rx="10" fill="#d8654d" /><rect x="840" y="192" width="83.64999999999999" height="24" rx="10" fill="#3b9c94" /><rect x="923.65" y="192" width="30.800000000000004" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="259"><tspan x="44" dy="0">Oral hygiene maintenance is time</tspan><tspan x="44" dy="18">consuming and difficult to follow.</tspan></text><rect x="615.65" y="255" width="175.7" height="24" rx="10" fill="#e7bf75" /><rect x="791.3499999999999" y="255" width="48.650000000000006" height="24" rx="10" fill="#d8654d" /><rect x="840" y="255" width="96.25000000000001" height="24" rx="10" fill="#3b9c94" /><rect x="936.25" y="255" width="29.400000000000002" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="313"><tspan x="44" dy="0">Neglecting oral hygiene develops</tspan><tspan x="44" dy="18">gum disease.</tspan></text><rect x="668.5" y="309" width="114.45" height="24" rx="10" fill="#e7bf75" /><rect x="782.95" y="309" width="57.050000000000004" height="24" rx="10" fill="#d8654d" /><rect x="840" y="309" width="117.25" height="24" rx="10" fill="#3b9c94" /><rect x="957.25" y="309" width="61.24999999999999" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="367"><tspan x="44" dy="0">Attending workplace awareness</tspan><tspan x="44" dy="18">programs will improve gum health.</tspan></text><rect x="707.35" y="363" width="113.04999999999998" height="24" rx="10" fill="#e7bf75" /><rect x="820.4" y="363" width="19.599999999999998" height="24" rx="10" fill="#d8654d" /><rect x="840" y="363" width="170.1" height="24" rx="10" fill="#3b9c94" /><rect x="1010.1" y="363" width="47.25" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="421"><tspan x="44" dy="0">Bleeding gums should not be</tspan><tspan x="44" dy="18">ignored.</tspan></text><rect x="715.75" y="417" width="89.25" height="24" rx="10" fill="#e7bf75" /><rect x="805" y="417" width="35" height="24" rx="10" fill="#d8654d" /><rect x="840" y="417" width="164.5" height="24" rx="10" fill="#3b9c94" /><rect x="1004.5" y="417" width="61.24999999999999" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="475"><tspan x="44" dy="0">Workplace stress can have an</tspan><tspan x="44" dy="18">impact on my gum and oral health.</tspan></text><rect x="721.35" y="471" width="94.85000000000001" height="24" rx="10" fill="#e7bf75" /><rect x="816.2" y="471" width="23.8" height="24" rx="10" fill="#d8654d" /><rect x="840" y="471" width="188.29999999999998" height="24" rx="10" fill="#3b9c94" /><rect x="1028.3" y="471" width="43.4" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="530"><tspan x="44" dy="0">Oral hygiene aids like floss or</tspan><tspan x="44" dy="18">mouthwash can be used if</tspan><tspan x="44" dy="18">recommended by a dentist.</tspan></text><rect x="724.15" y="534" width="92.05" height="24" rx="10" fill="#e7bf75" /><rect x="816.1999999999999" y="534" width="23.8" height="24" rx="10" fill="#d8654d" /><rect x="840" y="534" width="191.10000000000002" height="24" rx="10" fill="#3b9c94" /><rect x="1031.1" y="534" width="43.4" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="602"><tspan x="44" dy="0">Maintaining oral hygiene is</tspan><tspan x="44" dy="18">equally important as maintaining</tspan><tspan x="44" dy="18">physical fitness.</tspan></text><rect x="727.3" y="606" width="68.25" height="24" rx="10" fill="#e7bf75" /><rect x="795.55" y="606" width="44.45" height="24" rx="10" fill="#d8654d" /><rect x="840" y="606" width="168.70000000000002" height="24" rx="10" fill="#3b9c94" /><rect x="1008.7" y="606" width="68.25" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="674"><tspan x="44" dy="0">Poor gum health can negatively</tspan><tspan x="44" dy="18">affect my confidence or social</tspan><tspan x="44" dy="18">interactions.</tspan></text><rect x="729.75" y="678" width="90.65" height="24" rx="10" fill="#e7bf75" /><rect x="820.4" y="678" width="19.599999999999998" height="24" rx="10" fill="#d8654d" /><rect x="840" y="678" width="172.9" height="24" rx="10" fill="#3b9c94" /><rect x="1012.9" y="678" width="66.85" height="24" rx="10" fill="#234d70" /><text class="label" text-anchor="start" x="44" y="746"><tspan x="44" dy="0">Investing in preventive dental</tspan><tspan x="44" dy="18">care is better than spending on</tspan><tspan x="44" dy="18">treatment later.</tspan></text><rect x="745.15" y="750" width="66.85" height="24" rx="10" fill="#e7bf75" /><rect x="812" y="750" width="28" height="24" rx="10" fill="#d8654d" /><rect x="840" y="750" width="172.9" height="24" rx="10" fill="#3b9c94" /><rect x="1012.9" y="750" width="82.25" height="24" rx="10" fill="#234d70" />
</svg>